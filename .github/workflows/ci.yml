name: CI

# Drop all GITHUB_TOKEN permissions; checkout works without them on public repos.
permissions: {}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs; main pushes use SHA so each commit gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm reads its version from packageManager and installs the Node that
      # devEngines.runtime pins, so the runner's own Node never runs the build.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          standalone: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show toolchain
        run: pnpm --version && pnpm exec node --version

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

      - name: Build
        env:
          CHARTS_BLOB_URL: ${{ secrets.CHARTS_BLOB_URL }}
          CHARTS_READ_KEY: ${{ secrets.CHARTS_READ_KEY }}
        run: pnpm build
