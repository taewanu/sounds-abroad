name: Cron Crawl

# Drop all GITHUB_TOKEN permissions; this workflow only runs pnpm install + crawl.
permissions: {}

on:
  schedule:
    - cron: '17 4,11,16,22 * * *' # UTC; ADR-0002. Minute off :00 to avoid GH Actions scheduler peak.
  workflow_dispatch:

# A run is long (a large share of its timeout); never cancel an in-flight run
# for a superseding trigger: that would forfeit the chart refresh it's mid-way through.
concurrency:
  group: cron-crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl + Publish + Revalidate
    runs-on: ubuntu-latest
    # Taking each storefront's whole hundred rather than its first quarter puts
    # the songs axis at roughly 6,300 Spotify lookups a run, throttled to five a
    # second: about 21 minutes for that axis and about 55 for the whole run,
    # measured 2026-07-22 over 63 countries. The headroom is deliberate.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm reads its version from packageManager and installs the Node that
      # devEngines.runtime pins, so the runner's own Node never runs the crawl.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          standalone: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check scripts run on the pinned Node
        run: test "$(pnpm exec node -p 'process.version')" = "v$(pnpm exec node -p 'require("./package.json").devEngines.runtime.version')"

      # Secrets are scoped to this step, not the job: only the crawl consumes
      # them, and install can run dependency lifecycle scripts that would
      # otherwise see them.
      - name: Crawl, publish, and revalidate
        run: pnpm crawl:cron
        env:
          SITE_URL: https://sounds-abroad.vercel.app
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CHARTS_BLOB_URL: ${{ secrets.CHARTS_BLOB_URL }}
          CHARTS_READ_KEY: ${{ secrets.CHARTS_READ_KEY }}
          COMMENTARY_BLOB_URL: ${{ secrets.COMMENTARY_BLOB_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
